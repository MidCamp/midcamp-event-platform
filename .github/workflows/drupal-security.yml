name: Drupal security advisory

on:
  repository_dispatch:
    types:
      - drupal-security-advisory
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A rapid advisory recovery must not replace an older pending dispatch.
  group: drupal-security-${{ github.event_name == 'repository_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  inspect-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Validate the payload and select installed advisory packages
        id: package
        env:
          ADVISORIES_JSON: ${{ toJson(github.event.client_payload.advisories) }}
          ADVISORY_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "repository_dispatch" ]]; then
            printf '[]\n' > advisories.json
          elif [[ "$ADVISORY_SOURCE" != "drupal-security-dispatcher" ]]; then
            echo "::error::Invalid advisory source."
            exit 1
          else
            printf '%s' "$ADVISORIES_JSON" | jq -c '.' > advisories.json
          fi
          jq -e '
            type == "array" and all(.[];
              (.advisory_id | type == "string") and
              (
                ((.advisory_id | test("^SA-(CORE|CONTRIB)-[0-9]{4}-[0-9]{3}$")) and
                 (.url == ("https://www.drupal.org/" + (.advisory_id | ascii_downcase))) and
                 (.composer_package | test("^drupal/[a-z0-9][a-z0-9_.-]*$"))) or
                ((.advisory_id | test("^PSA-[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and
                 .kind == "psa" and .project_type == "psa" and
                 .composer_package == "" and .project_name == "" and
                 (.url == ("https://www.drupal.org/" + (.advisory_id | ascii_downcase))))
              )
            )
          ' advisories.json >/dev/null || {
            echo "::error::Invalid advisory payload."
            exit 1
          }
          jq '[.[] | select(.advisory_id | startswith("PSA-"))]' advisories.json > psas.json
          if jq -e 'length > 0' psas.json >/dev/null; then
            {
              printf '## Informational Drupal PSAs\n\n'
              jq -r '.[] | "- **[\(.advisory_id)](\(.url)):** \(.title)"' psas.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -c '.[] | select(.advisory_id | startswith("SA-"))' advisories.json |
          while IFS= read -r advisory; do
            package=$(jq -r '.composer_package // empty' <<< "$advisory")
            if [ -n "$package" ] &&
               composer show --locked "$package" --no-interaction >/dev/null 2>&1; then
              printf '%s\n' "$advisory"
            fi
          done | jq -s '.' > installed-advisories.json
          if jq -e 'length > 0' installed-advisories.json >/dev/null; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit locked dependencies
        if: steps.package.outputs.installed == 'true'
        id: audit
        continue-on-error: true
        run: composer audit --locked --format=json > composer-audit.json

      - name: Check which advisories affect installed versions
        if: steps.package.outputs.installed == 'true'
        id: affected
        run: |
          jq '
            if (.advisories | type) == "array" then
              .advisories
            else
              [.advisories | to_entries[] as $package |
                $package.value[] |
                . + {packageName: (.packageName // $package.key)}]
            end
          ' composer-audit.json > audit-records.json
          jq --slurpfile audit audit-records.json '
            [.[] | . as $advisory |
              select(any($audit[0][];
                .packageName == $advisory.composer_package and
                any(.. | strings;
                  ascii_downcase |
                  contains($advisory.advisory_id | ascii_downcase)
                )
              ))]
          ' installed-advisories.json > affected-advisories.json
          if jq -e 'length > 0' affected-advisories.json >/dev/null; then
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add affected advisories to the job summary
        if: steps.affected.outputs.vulnerable == 'true'
        run: |
          printf '## Drupal security advisories\n\n' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | [.advisory_id, .title, .project_type, .url] | @tsv' affected-advisories.json |
            while IFS=$'\t' read -r id title type url; do
              {
                printf -- '- **%s:** %s\n' "$id" "$title"
                printf '  - Project type: %s\n' "$type"
                printf '  - Details: %s\n' "$url"
              } >> "$GITHUB_STEP_SUMMARY"
            done

      - name: Upload the audit report
        if: steps.affected.outputs.vulnerable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: composer-security-audit
          path: |
            composer-audit.json
            affected-advisories.json
          if-no-files-found: ignore

      - name: Fail when vulnerable dependencies are found
        if: steps.affected.outputs.vulnerable == 'true'
        run: exit 1